{% extends "base.html" %}
{% block title %}로그인 · Reverse Proxy 관리자{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block body %}
<main class="login-wrap">
  <form class="card login-card" method="post" action="/login" autocomplete="on">
    <div class="login-head">
      <span class="brand-mark brand-mark-lg" aria-hidden="true"></span>
      <h1>Reverse Proxy 관리자</h1>
      <p class="muted">라우팅 설정을 관리하려면 로그인하세요.</p>
    </div>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" value="{{ username }}" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
</main>
{% endblock %}
