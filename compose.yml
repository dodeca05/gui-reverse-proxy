name: reverse-proxy

services:
  reverse-proxy:
    build: .
    image: reverse-proxy:latest
    restart: unless-stopped
    ports:
      # 호스트 공개 포트(PROXY_HTTP_PORT) → 컨테이너 내부 80
      - "${PROXY_HTTP_PORT:-80}:80"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (see .env.example)}
      DATABASE_PATH: /app/data/proxy.db
      LISTEN_PORT: "80"
      # 아래 값이 비어 있으면 애플리케이션 기본값을 사용한다 (.env.example 참고)
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-}
      ALLOWED_TARGET_SERVICES: ${ALLOWED_TARGET_SERVICES:-}
      BLOCKED_TARGET_SERVICES: ${BLOCKED_TARGET_SERVICES:-}
      ALLOWED_TARGET_NETWORKS: ${ALLOWED_TARGET_NETWORKS:-}
      PROXY_CONNECT_TIMEOUT: ${PROXY_CONNECT_TIMEOUT:-}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-}
      PROXY_KEEPALIVE_TIMEOUT: ${PROXY_KEEPALIVE_TIMEOUT:-}
      PROXY_POOL_LIMIT: ${PROXY_POOL_LIMIT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - proxy-data:/app/data
    networks:
      - proxy-network
    # 비 root 사용자가 80 포트를 열 수 있도록 허용 (추가 권한 없이)
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 테스트용 백엔드. 호스트에 포트를 공개하지 않으며 프록시를 통해서만 접근한다.
  # 운영 환경에서는 이 두 서비스를 삭제해도 된다.
  # ---------------------------------------------------------------------------
  test-app:
    build: ./examples/test-app
    image: reverse-proxy-example-test-app:latest
    restart: unless-stopped
    environment:
      SERVICE_NAME: test-app
      PORT: "1000"
    networks:
      - proxy-network
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"

  mcp-server:
    build: ./examples/mcp-server
    image: reverse-proxy-example-mcp-server:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      MCP_HEARTBEAT_SECONDS: "30"
    networks:
      - proxy-network

volumes:
  proxy-data:
    name: reverse-proxy-data

networks:
  proxy-network:
    name: proxy-network
    # 기본값 false: 이 Compose 프로젝트가 네트워크를 만든다.
    # `docker network create proxy-network` 로 미리 만들어 관리하려면 .env 에 PROXY_NETWORK_EXTERNAL=true
    external: ${PROXY_NETWORK_EXTERNAL:-false}
